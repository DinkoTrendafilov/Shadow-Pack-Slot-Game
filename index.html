<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🐺🦇 SHADOW PACK 🕷️🐦‍⬛</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}body{background:#0a0816;color:#f0ece4;font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;min-height:100vh;padding:20px;user-select:none;-webkit-user-select:none;overflow-x:hidden}.container{background:linear-gradient(145deg,#1a1530,#0f0b1e);padding:24px 20px;border-radius:30px;border:2px solid #3a2a5a;box-shadow:0 0 80px rgba(106,63,138,.3);max-width:780px;width:100%;text-align:center;position:relative}h1{font-size:28px;color:#c084e0;letter-spacing:2px}.sub{color:#8a7aa8;font-size:13px;margin-bottom:12px}

    .hud{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px;padding:8px;border-radius:14px;background:linear-gradient(145deg,#0f172a,#1e1b4b);border:1px solid #1e3a8a;box-shadow:0 0 30px rgba(59,130,246,.2),inset 0 0 20px rgba(15,23,42,.8);position:relative;overflow:hidden}
    .hud::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(59,130,246,.08),transparent 60%),radial-gradient(circle at 80% 70%,rgba(239,68,68,.06),transparent 60%);pointer-events:none;animation:cosmicDrift 8s ease-in-out infinite alternate}
    @keyframes cosmicDrift{0%{opacity:.6}100%{opacity:1}}
    .hud-item{background:linear-gradient(145deg,#0a1020,#0f172a);border:1px solid #1e3a8a;border-radius:10px;padding:8px 5px;position:relative;transition:all .3s;z-index:1}
    .hud-item:hover{border-color:#3b82f6;box-shadow:0 0 15px rgba(59,130,246,.3)}
    .hud-item .label{font-size:9px;color:#60a5fa;text-transform:uppercase;letter-spacing:1px;font-weight:700}
    .hud-item .value{font-size:15px;font-weight:900;margin-top:2px;color:#ffffff}
    .hud-item .value.green{color:#4ade80}
    .hud-item .value.red{color:#ef4444}
    .hud-item .value.blue{color:#60a5fa}
    .hud-item .value.rtp-green{color:#4ade80}
    .hud-item .value.rtp-yellow{color:#fbbf24}
    .hud-item .value.rtp-red{color:#ef4444}
    .hud-item .value.pl{color:#c084fc}
    .hud-item .value.gold{color:#ffd700}

    .reels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#050410;border-radius:12px;padding:8px;border:1px solid #1a1428;margin:12px 0;position:relative}
    .reel{background:#0c0918;border-radius:8px;overflow:hidden;height:300px;border:1px solid #1e1830;position:relative}
    .reel-strip{display:flex;flex-direction:column;will-change:transform;transition:transform 0s}
    .cell{height:75px;display:flex;align-items:center;justify-content:center;font-size:38px}
    .cell.dim{opacity:.3}
    .cell.lit{animation:pulse .8s ease-in-out infinite;position:relative;z-index:5}
    @keyframes pulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 6px #fbbf24)}50%{transform:scale(1.15);filter:drop-shadow(0 0 18px #fbbf24)}}
    .reel::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 18%,transparent 82%,rgba(0,0,0,.55));pointer-events:none;z-index:6}
    .reel::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(192,132,224,.15);pointer-events:none;z-index:6}

    .status{font-size:16px;min-height:32px;margin:6px 0 10px;color:#fbbf24}
    .status.big{font-size:22px;font-weight:bold;animation:flicker 1s ease-in-out infinite alternate}
    @keyframes flicker{from{opacity:.7}to{opacity:1}}

    .controls{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:12px 0}
    .controls button{border:none;border-radius:10px;padding:10px 2px;font-weight:bold;font-size:11px;cursor:pointer;transition:transform .06s}
    .controls button:active{transform:translateY(3px)}
    .controls button:disabled{opacity:.35;cursor:not-allowed;transform:none}
    .btn-spin{background:linear-gradient(180deg,#fbbf24,#d97706);color:#0a0710;box-shadow:0 4px 0 #92400e}
    .btn-auto{background:linear-gradient(180deg,#7c3aed,#4c1d95);color:#fff;box-shadow:0 4px 0 #2d1a70}
    .btn-stop{background:linear-gradient(180deg,#9b1c2e,#5c0e1a);color:#fff;box-shadow:0 4px 0 #3a0810}
    .btn-mute{background:#1e1830;color:#f0ece4;box-shadow:0 4px 0 #0a0814}
    .btn-save{background:#1e1830;color:#60a5fa;box-shadow:0 4px 0 #0a0814;border:1px solid #3a2a5a}
    .btn-new{background:#5c0e1a;color:#fff;box-shadow:0 4px 0 #3a0810;border:1px solid #7a1a2a}
    .btn-export{background:#1e1830;color:#4ade80;box-shadow:0 4px 0 #0a0814;border:1px solid #3a2a5a}
    .btn-import{background:#1e1830;color:#22d3ee;box-shadow:0 4px 0 #0a0814;border:1px solid #3a2a5a}
    .btn-gamble{background:#1e1830;color:#ffd700;box-shadow:0 4px 0 #0a0814;border:2px solid #3a2a5a;transition:all .3s}
    .btn-gamble.active{background:linear-gradient(145deg,#fbbf24,#d97706);color:#0a0710;border-color:#ffd700;box-shadow:0 4px 0 #92400e,0 0 30px rgba(251,191,36,.4);animation:gamblePulse 1.2s ease-in-out infinite}
    @keyframes gamblePulse{0%,100%{box-shadow:0 4px 0 #92400e,0 0 20px rgba(251,191,36,.3)}50%{box-shadow:0 4px 0 #92400e,0 0 50px rgba(251,191,36,.7)}}

    .bet-row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:8px 0}
    .bet-row button{background:#181528;border:1px solid #2a2240;color:#f0ece4;padding:4px 10px;border-radius:6px;cursor:pointer;font-weight:bold;font-size:12px}
    .bet-row button.active{background:#7c3aed;border-color:#4c1d95}
    .bet-row .label{color:#6b6480;font-size:13px;padding:4px 6px}

    /* ============================================================ */
    /* NEW WIN DISPLAY (Variant A — horizontal)                     */
    /* ============================================================ */
    .win-display{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      z-index:30;
      pointer-events:none;
      opacity:0;
      text-align:center;
      padding:24px 40px;
      border-radius:24px;
      background:rgba(10,8,22,.92);
      border:3px solid rgba(251,191,36,.6);
      box-shadow:0 0 60px rgba(251,191,36,.5),0 0 120px rgba(192,132,224,.3);
      backdrop-filter:blur(8px);
      min-width:340px;
    }
    .win-display.active{animation:winDisplayPop 2.0s ease-out forwards}
    @keyframes winDisplayPop{
      0%{opacity:0;transform:translate(-50%,-50%) scale(0.4)}
      12%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
      22%{transform:translate(-50%,-50%) scale(1)}
      80%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-60%) scale(0.95)}
    }
    .win-display.mega{border-color:rgba(255,93,143,.8);box-shadow:0 0 80px rgba(255,93,143,.7),0 0 160px rgba(192,132,224,.5)}
    .win-display .win-equation{
      font-size:34px;
      font-weight:900;
      color:#fbbf24;
      text-shadow:0 0 20px rgba(251,191,36,.8),0 0 40px rgba(251,191,36,.4);
      letter-spacing:2px;
      line-height:1.2;
      margin-bottom:8px;
      white-space:nowrap;
    }
    .win-display .win-equation .sym{color:#fff;text-shadow:0 0 20px rgba(255,255,255,.5)}
    .win-display .win-equation .op{color:#c084e0;margin:0 6px;font-size:28px}
    .win-display .win-equation .sum{color:#4ade80;text-shadow:0 0 20px rgba(74,222,128,.8)}
    .win-display .win-amount{
      font-size:46px;
      font-weight:900;
      color:#4ade80;
      text-shadow:0 0 30px rgba(74,222,128,.9),0 0 60px rgba(74,222,128,.4);
      letter-spacing:2px;
      line-height:1.1;
      margin-top:4px;
    }
    .win-display .win-amount .label{
      display:block;
      font-size:16px;
      color:#c084e0;
      letter-spacing:6px;
      margin-bottom:2px;
      font-weight:700;
    }
    .win-display.mega .win-equation{font-size:40px;color:#ff5d8f;text-shadow:0 0 30px rgba(255,93,143,.9)}
    .win-display.mega .win-equation .sym{color:#fff}
    .win-display.mega .win-equation .sum{color:#ff5d8f;text-shadow:0 0 30px rgba(255,93,143,.9)}
    .win-display.mega .win-amount{font-size:56px;color:#ff5d8f;text-shadow:0 0 40px rgba(255,93,143,.9);animation:megaPulse 1s ease-in-out infinite}
    @keyframes megaPulse{0%,100%{opacity:.9}50%{opacity:1}}

    .container.q-shake{animation:qshk .38s cubic-bezier(.36,.07,.19,.97)}
    @keyframes qshk{10%,90%{transform:translate3d(-1px,0,0)}20%,80%{transform:translate3d(2px,0,0)}30%,50%,70%{transform:translate3d(-4px,0,0)}40%,60%{transform:translate3d(4px,0,0)}}
    .container.q-glow{box-shadow:0 0 40px rgba(251,191,36,.55),0 0 120px rgba(192,132,224,.5),0 0 80px rgba(106,63,138,.3)!important}
    .container.q-bigwin{animation:qbw 1.2s ease-in-out!important}
    @keyframes qbw{0%{box-shadow:0 0 0 rgba(251,191,36,0)}20%{box-shadow:0 0 80px rgba(251,191,36,.8),0 0 160px rgba(251,191,36,.4);transform:scale(1.02)}40%{box-shadow:0 0 40px rgba(251,191,36,.6),0 0 120px rgba(74,222,128,.3);transform:scale(.98)}60%{box-shadow:0 0 80px rgba(251,191,36,.7),0 0 200px rgba(192,132,224,.3);transform:scale(1.01)}100%{box-shadow:0 0 40px rgba(251,191,36,.3),0 0 80px rgba(106,63,138,.2);transform:scale(1)}}
    .btn-spin.q-pulse{animation:qbp 1.1s ease-in-out infinite}
    @keyframes qbp{0%,100%{box-shadow:0 4px 0 #92400e,0 0 0 rgba(251,191,36,0)}50%{box-shadow:0 4px 0 #92400e,0 0 22px rgba(251,191,36,.7)}}


    /* ===== GAMBLE in HUD ===== */
    .hud-item.hud-gamble{display:flex;flex-direction:column;justify-content:space-between;padding:6px 5px}
    .hud-gamble .btn-gamble{width:100%;margin-top:3px;border-radius:8px;padding:5px 2px;font-weight:800;font-size:11px;line-height:1.2;cursor:pointer;min-height:36px}
    .hud-gamble .btn-gamble small{display:block;font-size:10px;font-weight:700;opacity:.9}
    .hud-gamble .btn-gamble:not(.active){box-shadow:0 3px 0 #0a0814}
    .hud-gamble .btn-gamble:disabled{opacity:.35;cursor:not-allowed}
    .hud-gamble .btn-gamble:not(:disabled):active{transform:translateY(2px)}
    .g-timer{height:4px;border-radius:2px;background:#1e1830;margin-top:5px;overflow:hidden;opacity:0;transition:opacity .15s}
    .g-timer.on{opacity:1}
    .g-timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#fbbf24,#f97316);transform-origin:left center}

    /* ===== WIN TIERS ===== */
    .win-display .win-tier{display:none;font-size:22px;font-weight:900;letter-spacing:6px;margin-bottom:8px;color:#fbbf24;text-shadow:0 0 18px rgba(251,191,36,.9)}
    .win-display.t3 .win-tier,.win-display.t4 .win-tier,.win-display.t5 .win-tier,.win-display.t6 .win-tier{display:block}
    .win-display.t3.active,.win-display.t4.active,.win-display.t5.active,.win-display.t6.active{animation:winDisplayPopBig 4s ease-out forwards}
    @keyframes winDisplayPopBig{
      0%{opacity:0;transform:translate(-50%,-50%) scale(0.3)}
      5%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}
      8%{transform:translate(-50%,-50%) scale(1)}
      92%{opacity:1;transform:translate(-50%,-50%) scale(1)}
      100%{opacity:0;transform:translate(-50%,-60%) scale(0.95)}
    }
    .win-display.t3{border-color:#fbbf24}
    .win-display.t4{border-color:rgba(255,93,143,.9);box-shadow:0 0 80px rgba(255,93,143,.7),0 0 160px rgba(192,132,224,.5)}
    .win-display.t4 .win-tier,.win-display.t4 .win-amount{color:#ff5d8f;text-shadow:0 0 30px rgba(255,93,143,.9)}
    .win-display.t5{border-color:#22d3ee;box-shadow:0 0 90px rgba(34,211,238,.7),0 0 180px rgba(124,58,237,.6)}
    .win-display.t5 .win-tier,.win-display.t5 .win-amount{color:#22d3ee;text-shadow:0 0 30px rgba(34,211,238,.9)}
    .win-display.t6{border-color:#ffd700;box-shadow:0 0 110px rgba(255,215,0,.9),0 0 220px rgba(255,93,143,.6);background:rgba(30,16,4,.94)}
    .win-display.t6 .win-tier{font-size:28px;color:#ffd700;text-shadow:0 0 30px rgba(255,215,0,1);animation:megaPulse .6s ease-in-out infinite}
    .win-display.t6 .win-amount{color:#ffd700;text-shadow:0 0 40px rgba(255,215,0,1)}
    .win-display.t4 .win-amount,.win-display.t5 .win-amount,.win-display.t6 .win-amount{font-size:56px}
    #fxc{position:fixed;inset:0;z-index:250;pointer-events:none}

    #qbg{position:fixed;inset:0;z-index:-1;pointer-events:none}

    @media(max-width:600px){
      .hud{grid-template-columns:repeat(3,1fr);gap:5px}
      .hud-item{padding:6px 4px}
      .hud-item .label{font-size:8px;letter-spacing:.5px}
      .hud-item .value{font-size:13px}
      .controls{grid-template-columns:repeat(3,1fr)}
      .container{padding:12px}
      h1{font-size:22px}
      .win-display{padding:18px 24px;min-width:280px}
      .win-display .win-equation{font-size:24px}
      .win-display .win-equation .op{font-size:20px;margin:0 4px}
      .win-display .win-amount{font-size:32px}
      .win-display .win-amount .label{font-size:12px;letter-spacing:4px}
      .win-display.mega .win-equation{font-size:28px}
      .win-display.mega .win-amount{font-size:40px}
      .win-display .win-tier{font-size:16px;letter-spacing:4px}
      .win-display.t4 .win-amount,.win-display.t5 .win-amount,.win-display.t6 .win-amount{font-size:40px}
      .hud-gamble .btn-gamble{font-size:10px}
    }

    .gamble-overlay{position:fixed;inset:0;z-index:300;display:none;background:rgba(0,0,0,.88);backdrop-filter:blur(6px);justify-content:center;align-items:center;flex-direction:column;padding:20px;animation:fsFade .4s ease-out}
    .gamble-overlay.active{display:flex}
    @keyframes fsFade{0%{opacity:0;transform:scale(0.8)}100%{opacity:1;transform:scale(1)}}
    .gamble-box{background:linear-gradient(145deg,#1a1040,#0f0b1e);border-radius:30px;padding:30px 40px;max-width:520px;width:100%;border:3px solid #fbbf24;box-shadow:0 0 80px rgba(251,191,36,.3);text-align:center;position:relative}
    .gamble-box .g-title{font-size:28px;font-weight:900;color:#fbbf24;letter-spacing:2px}
    .gamble-box .g-win{font-size:20px;color:#fff;margin:6px 0 12px}
    .gamble-box .g-win span{color:#fbbf24;font-weight:900;font-size:28px}
    .gamble-box .g-options{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:6px;margin:12px 0}
    .gamble-box .g-options button{padding:8px 4px;border-radius:10px;border:2px solid #3a2a5a;background:#0c0918;color:#f0ece4;font-weight:bold;font-size:12px;cursor:pointer;transition:all .2s}
    .gamble-box .g-options button:hover{background:#1a1040;border-color:#a855f7;transform:scale(1.03)}
    .gamble-box .g-options button.g-selected{background:#7c3aed;border-color:#fbbf24;box-shadow:0 0 30px rgba(124,58,237,.4)}
    .gamble-box .g-number-pick{display:flex;gap:6px;justify-content:center;margin:8px 0;flex-wrap:wrap}
    .gamble-box .g-number-pick button{width:44px;height:44px;border-radius:50%;border:2px solid #3a2a5a;background:#0c0918;color:#f0ece4;font-weight:bold;font-size:20px;cursor:pointer;transition:all .2s}
    .gamble-box .g-number-pick button:hover{background:#1a1040;border-color:#a855f7;transform:scale(1.08)}
    .gamble-box .g-number-pick button.g-num-selected{background:#7c3aed;border-color:#fbbf24;box-shadow:0 0 30px rgba(124,58,237,.4)}
    .gamble-box .g-dice-area{display:flex;justify-content:center;align-items:center;margin:10px 0}
    .gamble-box .g-dice{font-size:80px;width:100px;height:100px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#1a1040,#0c0918);border-radius:16px;border:3px solid #fbbf24;box-shadow:0 0 40px rgba(251,191,36,.2);transition:all .3s}
    .gamble-box .g-dice.rolling{animation:diceRoll 0.6s ease-in-out}
    @keyframes diceRoll{0%{transform:scale(1) rotate(0deg)}25%{transform:scale(1.3) rotate(90deg)}50%{transform:scale(0.8) rotate(180deg)}75%{transform:scale(1.2) rotate(270deg)}100%{transform:scale(1) rotate(360deg)}}
    .gamble-box .g-dice.win{box-shadow:0 0 60px rgba(74,222,128,.6);border-color:#4ade80}
    .gamble-box .g-dice.lose{box-shadow:0 0 60px rgba(248,113,113,.6);border-color:#f87171}
    .gamble-box .g-result{font-size:18px;font-weight:bold;margin:8px 0;min-height:36px}
    .gamble-box .g-result.win{color:#4ade80}
    .gamble-box .g-result.lose{color:#f87171}
    .gamble-box .g-controls{display:flex;gap:10px;justify-content:center;margin:12px 0}
    .gamble-box .g-controls button{padding:10px 24px;border-radius:10px;font-weight:bold;font-size:14px;cursor:pointer;transition:all .2s;border:none}
    .gamble-box .g-btn-spin{background:linear-gradient(145deg,#fbbf24,#d97706);color:#0a0710;box-shadow:0 4px 0 #92400e}
    .gamble-box .g-btn-take{background:linear-gradient(145deg,#4ade80,#22c55e);color:#0a0710;box-shadow:0 4px 0 #166534}
    .gamble-box .g-btn-close{background:#5c0e1a;color:#fff;box-shadow:0 4px 0 #3a0810}
    .gamble-box .g-attempts{font-size:14px;color:#8a7aa8;margin:4px 0}
    .gamble-box .g-attempts span{color:#fbbf24;font-weight:bold}
    .gamble-stats{font-size:14px;color:#8a7aa8;margin:4px 0;border-top:1px solid #2a2240;padding-top:8px}
    .gamble-stats .stat-row{display:flex;justify-content:space-between;padding:2px 0}
    .gamble-stats .stat-label{color:#6b6480}
    .gamble-stats .stat-value{color:#f0ece4;font-weight:bold}
    .gamble-stats .stat-value.win{color:#4ade80}
    .gamble-stats .stat-value.loss{color:#f87171}
    .gamble-box .g-number-hint{font-size:13px;color:#c084e0;margin:4px 0 2px;font-weight:bold}
    .gamble-box .g-number-hint span{color:#fbbf24}
  </style>
</head>
<body>
<canvas id="qbg"></canvas>
<canvas id="fxc"></canvas>
<div class="container">
<h1>🐺🦇 SHADOW PACK 🕷️🐦‍⬛</h1>
<div class="sub">4 symbols · Top-2 sum · RTP ~96%</div>

<div class="hud">
  <div class="hud-item"><div class="label">Credits</div><div class="value green" id="h1">200,000.00</div></div>
  <div class="hud-item"><div class="label">Bet</div><div class="value pl" id="h2">1</div></div>
  <div class="hud-item"><div class="label">Spins</div><div class="value gold" id="h5">0/100</div></div>
  <div class="hud-item"><div class="label">Cycles</div><div class="value gold" id="h6">0</div></div>
  <div class="hud-item hud-gamble"><button class="btn-gamble" id="gb" disabled>🎲 GAMBLE</button><div class="g-timer" id="gTimer"><i id="gTimerBar"></i></div></div>
  <div class="hud-item"><div class="label">Session RTP</div><div class="value" id="sessionRtp">0.00%</div></div>
</div>

<div class="reels" id="r0">
  <div class="win-display" id="wp">
    <div class="win-tier" id="wt"></div>
    <div class="win-equation" id="we">🐺 × 7 <span class="op">+</span> 🦇 × 6 <span class="op">=</span> <span class="sum">13</span></div>
    <div class="win-amount" id="wa"><span class="label">WIN</span>+0.00</div>
  </div>
</div>
<div class="status" id="st">Welcome. Press SPIN to start.</div>
<div class="bet-row" id="br"><span class="label">Bet:</span></div>
<div class="controls">
  <button class="btn-mute" id="mu">🔊 Sound</button>
  <button class="btn-spin" id="sp">SPIN</button>
  <button class="btn-auto" id="au">AUTO</button>
  <button class="btn-stop" id="stp" disabled>STOP</button>
  <button class="btn-save" id="saveBtn">💾 Save</button>
  <button class="btn-export" id="expBtn">📤 Export</button>
  <button class="btn-import" id="impBtn">📥 Import</button>
  <button class="btn-new" id="newBtn">🔄 New</button>
</div>
<input type="file" id="impFile" accept=".json,application/json" style="display:none">
</div>

<div class="gamble-overlay" id="gambleOverlay">
  <div class="gamble-box">
    <div class="g-title">🎲 GAMBLE</div>
    <div class="g-win">Current Win: <span id="gWinAmount">0.00</span></div>
    <div class="g-attempts">Attempts: <span id="gAttempts">0</span></div>
    <div class="gamble-stats" id="gambleStats">

    gOpts.forEach(function(btn){ btn.classList.remove('g-selected'); });
    document.querySelectorAll('#gNumberPick button').forEach(function(btn){ btn.classList.remove('g-num-selected'); });
    gambleBetType = type; gNumberPick.style.display = 'none';
    if (gNumberHint) gNumberHint.style.display = 'none';
    gambleNumbers = [];

    if (type === 'number') {
      gNumberPick.style.display = 'flex';
      if (event && event.currentTarget) event.currentTarget.classList.add('g-selected');
      setStatus('🎯 Pick 1 to 6 numbers (1→×6, 2→×3, 3→×2, 4→×1.5, 5→×1.2, 6→×1)!', false);
    } else {
      var labels = { small:'SMALL (1,2,3)', big:'BIG (4,5,6)', even:'EVEN (2,4,6)', odd:'ODD (1,3,5)' };
      setStatus('Bet: ' + labels[type] + ' - Click SPIN DICE!', false);
      if (event && event.currentTarget) event.currentTarget.classList.add('g-selected');
    }
  }
  function toggleGambleNumber(num) {
    if (!gambleActive || gambleDiceResult !== null) return;
    if (gambleBetType !== 'number') {
      gambleBetType = 'number';
      gOpts.forEach(function(btn){ btn.classList.remove('g-selected'); });
    }
    var idx = gambleNumbers.indexOf(num);
    if (idx >= 0) { gambleNumbers.splice(idx, 1); } else { gambleNumbers.push(num); gambleNumbers.sort(function(a,b){ return a-b; }); }
    document.querySelectorAll('#gNumberPick button').forEach(function(btn){
      var n = parseInt(btn.textContent);
      if (gambleNumbers.indexOf(n) >= 0) btn.classList.add('g-num-selected');
      else btn.classList.remove('g-num-selected');
    });
    updatePickHint();
    var n = gambleNumbers.length;
    if (n === 0) setStatus('🎯 Pick at least 1 number!', false);
    else setStatus('🎯 ' + n + ' number(s): [' + gambleNumbers.join(', ') + '] → ×' + getPickMultiplier(n) + '  |  Click SPIN DICE!', false);
  }
  function spinDice() {
    if (!gambleActive || gambleDiceResult !== null) return;
    if (gambleBetType === 'number' && gambleNumbers.length === 0) { setStatus('Pick at least 1 number first!', false); return; }
    if (!gambleBetType) { setStatus('Choose a bet first!', false); return; }
    gSpinBtn.disabled = true; gTakeBtn.disabled = true; ____(gResult, ''); gDice.className = 'g-dice rolling';
    playDiceRattle();
    var result = secureRandomInt(1, 7);
    setTimeout(function(){
      gDice.className = 'g-dice'; ____(gDice, diceEmojis[result - 1]);
      gambleDiceResult = result; var win = false; var multiplier = 1;
      switch(gambleBetType) {
        case 'small': win = (result >= 1 && result <= 3); multiplier = 2; break;
        case 'big': win = (result >= 4 && result <= 6); multiplier = 2; break;
        case 'even': win = (result % 2 === 0); multiplier = 2; break;
        case 'odd': win = (result % 2 === 1); multiplier = 2; break;
        case 'number':
          win = (gambleNumbers.indexOf(result) >= 0);
          multiplier = getPickMultiplier(gambleNumbers.length);
          break;
      }
      if (win) {
        gambleWin *= multiplier; ____(gWinAmount, fmt(gambleWin));
        var winText = '✅ YOU WIN! +' + fmt(gambleWin);
        if (gambleBetType === 'number') winText += '  (×' + multiplier + ')';
        ____(gResult, winText);
        gResult.className = 'g-result win'; gDice.classList.add('win'); gambleAttempts++; ____(gAttempts, gambleAttempts);
        gambleSessions++; updateGambleStatsDisplay();
        playWinTier(Math.min(getWinTier(gambleWin / bet), 3));
        gSpinBtn.disabled = false; gTakeBtn.disabled = false;
        gambleDiceResult = null; gambleBetType = null; gambleNumbers = [];
        gOpts.forEach(function(btn){ btn.classList.remove('g-selected'); });
        document.querySelectorAll('#gNumberPick button').forEach(function(btn){ btn.classList.remove('g-num-selected'); });
        gNumberPick.style.display = 'none';
        if (gNumberHint) gNumberHint.style.display = 'none';
        setStatus('✅ YOU WIN! +' + fmt(gambleWin), false);
        setTimeout(function(){ ____(gDice, '🎲'); gDice.classList.remove('win'); }, 800);
      } else {
        var lostAmount = gambleOriginalBet; gambleWin = 0;
        ____(gWinAmount, fmt(0)); ____(gResult, '❌ YOU LOSE! -' + fmt(lostAmount));
        gResult.className = 'g-result lose'; gDice.classList.add('lose'); gSpinBtn.disabled = true; gTakeBtn.disabled = true;
        gambleTotalLoss += lostAmount; gambleSessions++; updateGambleStatsDisplay();
        playNoise(0.3, 0.15, 0, 'lowpass', 400, 2);
        [200, 180, 160].forEach(function(f, i){ playTone(f, 0.15, 'square', 0.05, i * 0.12, 600); });
        setStatus('❌ YOU LOSE! -' + fmt(lostAmount), false);
        resetGambleBtn();
        pendingGambleWin = 0;
        setTimeout(function(){ closeGamble(false); }, 1500);
      }
      updateHUD();
    }, 800);
  }

  function shakeAndGlow(){ var c = document.querySelector('.container'); c.classList.add('q-shake','q-glow'); setTimeout(function(){ c.classList.remove('q-shake','q-glow'); }, 1100); }
  function bigWinAnimation(){ var c = document.querySelector('.container'); c.classList.add('q-bigwin'); setTimeout(function(){ c.classList.remove('q-bigwin'); }, 1200); }

  var isSpinning = false, isAuto = false, autoId = 0;

  // ============================================================
  // DO SPIN
  // ============================================================
  async function doSpin(){
    if(isSpinning) return;
    if(isMegaWinShowing) { setStatus('⚠️ Complete Mega Win first!', false); return; }
    if(typeof bet !== 'number' || isNaN(bet) || bet <= 0) { setStatus('⚠️ Invalid bet!', false); return; }
    if(balance < bet){ setStatus('Not enough credits.', false); return; }
    isSpinning = true; spinBtn.disabled = true;
    if(!isAuto) autoBtn.disabled = true;
    pendingGambleWin = 0; resetGambleBtn();
    try{
      initAudio();
      balance -= bet; spinCount++;
      sessionTotalBet += bet;
      updateHUD();
      var matrix = getMatrix(); setStatus('Spinning...', false);
      await animateReels(matrix);

      // ============ TOP-2 SUM EVALUATION ============
      var counts = {};
      SYM.forEach(function(s){ counts[s] = 0; });
      for(var r=0; r<4; r++){
        for(var c=0; c<5; c++){
          counts[matrix[r][c]] = (counts[matrix[r][c]] || 0) + 1;
        }
      }
      // Sort symbols by count descending
      var sortedSyms = SYM.slice().sort(function(a,b){ return counts[b] - counts[a]; });
      var top1 = sortedSyms[0];
      var top2 = sortedSyms[1];
      var top1Count = counts[top1];
      var top2Count = counts[top2];
      var top2Sum = top1Count + top2Count;

      var spinWin = 0;
      var payout = PAYTABLE[top2Sum] || 0;
      if (payout > 0) {
        spinWin = payout * bet;
      }

      if(typeof spinWin !== 'number' || isNaN(spinWin)) spinWin = 0;

      if(spinWin > 0){ balance += spinWin; sessionTotalWon += spinWin; }

      var didWin = spinWin > 0;
      if(didWin){
        var mult = spinWin / bet;
        var tier = getWinTier(mult);
        var holdMs = TIER_HOLD[tier];
        var isMega = tier >= 3;

        if(tier >= 3) shakeAndGlow();
        if(tier >= 4) bigWinAnimation();
        playWinTier(tier);
        burstEffect(tier);
        showWinDisplay([top1, top2], [top1Count, top2Count], top2Sum, spinWin, holdMs, tier);

        if(isMega) isMegaWinShowing = true;
        await new Promise(function(r){ setTimeout(r, holdMs); });
        isMegaWinShowing = false;

        setStatus(top1 + ' × ' + top1Count + ' + ' + top2 + ' × ' + top2Count + ' = ' + top2Sum + '  →  WIN +' + fmt(spinWin), false);

        // GAMBLE becomes available once the win display has hidden
        armGambleBtn(spinWin);
        if(isAuto){
          await gambleWindow(GAMBLE_WINDOW_MS);          // 2.5s to press GAMBLE before AUTO continues
          if(!gambleActive && isAuto){ pendingGambleWin = 0; resetGambleBtn(); }
          else stopGambleTimer();
        }
      } else {
        setStatus(top1 + ' × ' + top1Count + ' + ' + top2 + ' × ' + top2Count + ' = ' + top2Sum + '  →  No win', false);
        winDisplay.classList.remove('active');
        lossStreak++;
        if(lossStreak >= 4 && secureRandom() < 0.3){ playAmbientStinger(); lossStreak = 0; }
        pendingGambleWin = 0; resetGambleBtn();
      }

      if(spinCount >= 100){ spinCount = 0; cycleCount++; updateHUD(); }
      updateHUD(); saveGame();
      if(!didWin) await new Promise(function(r){ setTimeout(r, 600); });
    } finally {
      isSpinning = false; spinBtn.disabled = false;
      if(!isAuto) autoBtn.disabled = false;
    }
  }

  async function animateReels(matrix){
    var promises = [];
    for(var c=0;c<5;c++){
      var colSymbols = [];
      for(var r=0;r<4;r++) colSymbols.push(matrix[r][c]);
      promises.push(animateReel(c, colSymbols, c * 150));
    }
    await Promise.all(promises);
  }
  function animateReel(index, symbols, delay){
    return new Promise(function(resolve){
      var strip = strips[index]; var fullStrip = [];
      for(var i=0;i<28;i++) fullStrip.push(randomSymbolFromReel(index));
      symbols.forEach(function(s){ fullStrip.push(s); });
      strip.style.transition = 'none'; strip.style.transform = 'translateY(0)'; _____(strip, '');
      fullStrip.forEach(function(sym){ var cell = $$('div'); cell.className = 'cell dim'; ____(cell, sym); ___(strip, cell); });
      var offset = (fullStrip.length - 4) * 75;
      var duration = 1100 + delay;
      setTimeout(function(){
        requestAnimationFrame(function(){ strip.style.transition = 'transform ' + duration + 'ms cubic-bezier(.18,.85,.32,1)'; strip.style.transform = 'translateY(-' + offset + 'px)'; });
        setTimeout(function(){ strip.style.transition = 'none'; }, duration + 40);
        setTimeout(function(){ renderReel(index, symbols); playReelStopSound(index); resolve(); }, duration + 60);
      }, delay);
    });
  }

  // ============================================================
  // EVENT LISTENERS
  // ============================================================
  gambleBtn.addEventListener('click', function(){ if (pendingGambleWin > 0 && !gambleActive) openGamble(pendingGambleWin); else if (pendingGambleWin <= 0) setStatus('⚠️ No win to gamble!', false); });
  gOpts.forEach(function(btn){ btn.addEventListener('click', function(e){ selectGambleBet(this.getAttribute('data-bet'), e); }); });
  document.querySelectorAll('#gNumberPick button').forEach(function(btn){ btn.addEventListener('click', function(){ toggleGambleNumber(parseInt(this.textContent)); }); });
  gSpinBtn.addEventListener('click', spinDice);
  gTakeBtn.addEventListener('click', function(){ if (gambleActive && gambleWin > 0) closeGamble(true); else if (gambleActive) closeGamble(false); });
  gCloseBtn.addEventListener('click', function(){ if (gambleActive) closeGamble(true); });

  spinBtn.addEventListener('click', function(){
    if(isAuto) return;
    if(isMegaWinShowing) { setStatus('⚠️ Complete Mega Win first!', false); return; }
    if (gambleActive) { setStatus('⚠️ Complete Gamble first!', false); return; }
    doSpin();
  });

  autoBtn.addEventListener('click', function(){
    if(isAuto) return;
    if (gambleActive) { setStatus('⚠️ Complete Gamble first!', false); return; }
    playUIClick(); autoId++;
    var currentId = autoId;
    isAuto = true; autoBtn.disabled = true; spinBtn.disabled = true; stopBtn.disabled = false;
    setAutoAmbience(true);
    (async function(){
      while(isAuto && currentId === autoId){
        if(isMegaWinShowing){ await new Promise(function(r){ setTimeout(r, 500); }); continue; }
        if (gambleActive){ await new Promise(function(r){ setTimeout(r, 500); }); continue; }
        if(balance < bet){ setStatus('Out of credits.', false); break; }
        await doSpin();
        await new Promise(function(r){ setTimeout(r, 300); });
      }
      autoBtn.disabled = false; spinBtn.disabled = false; stopBtn.disabled = true;
      isAuto = false; setAutoAmbience(false);
    })();
  });

  stopBtn.addEventListener('click', function(){
    playUIClick(); isAuto = false; autoId++; stopGambleTimer();
    autoBtn.disabled = false; spinBtn.disabled = false; stopBtn.disabled = true;
    setStatus('Auto stopped.', false); setAutoAmbience(false);
  });

  muteBtn.addEventListener('click', function(){
    soundEnabled = !soundEnabled;
    ____(muteBtn, soundEnabled ? '🔊 Sound' : '🔇 Sound');
    if(soundEnabled) playUIClick();
    if(bgGain && audioCtx){
      var now = audioCtx.currentTime; bgGain.gain.cancelScheduledValues(now); bgGain.gain.setValueAtTime(bgGain.gain.value, now);
      bgGain.gain.linearRampToValueAtTime(soundEnabled ? bgBaseLevel : 0, now + 0.2);
    }
  });

  saveBtn.addEventListener('click', function(){ playUIClick(); saveGame(); setStatus('💾 Game saved!', false); setTimeout(function(){ setStatus('Ready.', false); }, 800); });
  expBtn.addEventListener('click', function(){ playUIClick(); exportGame(); });
  impBtn.addEventListener('click', function(){ playUIClick(); impFile.click(); });
  impFile.addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]){
      importGame(e.target.files[0]);
      e.target.value = '';
    }
  });

  window.addEventListener('beforeunload', function() { saveGame(); });
  window.addEventListener('pagehide', function() { saveGame(); });

  var betOptions = [0.4, 1, 2, 4, 10, 20, 40, 100, 250, 500, 1000];
  betOptions.forEach(function(val){
    var btn = $$('button'); ____(btn, val);
    if(val === bet) btn.classList.add('active');
    btn.addEventListener('click', function(){
      if(isMegaWinShowing) { setStatus('⚠️ Complete Mega Win first!', false); return; }
      if (gambleActive) { setStatus('⚠️ Complete Gamble first!', false); return; }
      playUIClick();
      var btns = _('#br button');
      for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
      btn.classList.add('active'); bet = val; updateHUD(); saveGame();
    });
    ___(betRow, btn);
  });

  resetReels();
  var loaded = loadGame();
  if (!loaded) { updateHUD(); setStatus('Welcome. Press SPIN to start.', false); }
  spinBtn.classList.add('q-pulse');
  gambleBtn.disabled = true;

  (function(){
    var canvas = $('qbg'); var ctx = canvas.getContext('2d');
    function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);
    var particles = [];
    for(var i=0;i<36;i++){
      particles.push({x: secureRandom() * window.innerWidth, y: secureRandom() * window.innerHeight, r: 0.6 + secureRandom() * 1.8, s: 0.12 + secureRandom() * 0.3, o: 0.12 + secureRandom() * 0.32, g: secureRandom() < 0.25});
    }
    (function animateParticles(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(function(p){
        p.y -= p.s; if(p.y < -5){ p.y = canvas.height + 5; p.x = secureRandom() * canvas.width; }
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 2 * Math.PI);
        ctx.fillStyle = p.g ? 'rgba(251,191,36,' + p.o + ')' : 'rgba(192,132,224,' + p.o + ')';
        ctx.fill();
      });
      requestAnimationFrame(animateParticles);
    })();
  })();

  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

})();
